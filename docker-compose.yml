version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: code-review-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-code_review}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-code_review_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-code_review}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - code-review-network

  # Code Review Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code-review-app
    # restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database Configuration
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-code_review}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-code_review_db}
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      # GitHub Configuration (from .env file)
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      
      # Azure OpenAI (Entra client credentials)
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_TENANT_ID: ${AZURE_OPENAI_TENANT_ID}
      AZURE_OPENAI_CLIENT_ID: ${AZURE_OPENAI_CLIENT_ID}
      AZURE_OPENAI_CLIENT_SECRET: ${AZURE_OPENAI_CLIENT_SECRET}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-08-01-preview}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME}
      AZURE_OPENAI_TOKEN_SCOPE: ${AZURE_OPENAI_TOKEN_SCOPE:-https://cognitiveservices.azure.com/.default}
      AZURE_OPENAI_MAX_TOKENS: ${AZURE_OPENAI_MAX_TOKENS:-4096}
      AZURE_OPENAI_TEMPERATURE: ${AZURE_OPENAI_TEMPERATURE:-0.7}
      
      # Bot Behavior
      AUTO_REVIEW_ENABLED: ${AUTO_REVIEW_ENABLED:-true}
      REVIEW_ON_READY_FOR_REVIEW: ${REVIEW_ON_READY_FOR_REVIEW:-true}
      REVIEW_ON_NEW_COMMITS: ${REVIEW_ON_NEW_COMMITS:-true}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src  # Mount source for development (remove in production)
    networks:
      - code-review-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: code-review-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - code-review-network
    profiles:
      - debug  # Only start with: docker-compose --profile debug up

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  code-review-network:
    driver: bridge
