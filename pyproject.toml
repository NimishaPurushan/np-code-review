[project]
name = "np-code-review"
version = "0.1.0"
description = "Code Review Github Bot"
readme = "README.md"
requires-python = ">=3.11"
maintainers = [
    {name = "Nimisha Purushan", email="nimisha.mec@gmail.com"}
]

[project.optional-dependencies]
dependencies = [
    "ruff>=0.15.8",
]


[tool.ruff]
# File selection
include = ["src/**/*.py"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".ruff_cache",
]

# Set the maximum line length
line-length = 100

# Python version
target-version = "py311"

[tool.ruff.lint]
# Enable common linting rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
]

# Ignore specific rules if needed
ignore = [
    "E501",  # Line too long (handled by formatter)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Auto-detect line ending
line-ending = "auto"